<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Inventario Lab Redes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <main class="flex-grow flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border border-slate-100">
            <div class="flex flex-col items-center mb-6">
                <div class="w-14 h-14 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow-lg mb-3">
                    <i data-lucide="network" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Lab. de Redes</h1>
                <p class="text-sm text-slate-500">Sistema de Gestión de Inventario</p>
            </div>

            <form id="form-login" class="space-y-4">
                <div>
                    <label for="login-correo" class="block text-sm font-medium text-slate-700 mb-1">Correo Institucional</label>
                    <input type="email" id="login-correo" required autocomplete="username" placeholder="usuario@uaq.mx"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>
                <div>
                    <label for="login-password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>
                <button type="submit" id="btn-login-submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow transition flex items-center justify-center gap-2 cursor-pointer">
                    <span>Iniciar Sesión</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <p class="text-sm text-slate-500 text-center mt-6">
                ¿Aún no tienes cuenta?
                <a href="registro.html" class="font-semibold text-indigo-600 hover:text-indigo-800 hover:underline">Crear cuenta</a>
            </p>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
